<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>ระบบกิจกรรมการตลาด | รถบรรทุกขนาดกลางและใหญ่</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer onload="window.initGIS && initGIS()"></script>
<style>
:root{
  --bg:#f4f6fb;--surface:#fff;--surface2:#f8fafc;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;
  --brand:#2563eb;--brand-d:#1d4ed8;--brand-soft:#eaf1ff;--accent:#f97316;
  --ok:#16a34a;--warn:#d97706;--bad:#dc2626;
  --radius:16px;--shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0b1220;--surface:#111a2e;--surface2:#0e1627;--text:#e6ebf5;--muted:#93a1ba;--line:#1e2a45;
    --brand:#5b8cff;--brand-d:#7aa2ff;--brand-soft:#16244a;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25)}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:400 15px/1.55 'Noto Sans Thai','Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.hidden{display:none!important}
.muted{color:var(--muted)}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;background:var(--brand);color:#fff;padding:10px 18px;border-radius:12px;font-weight:600;min-height:44px;transition:.15s;text-decoration:none}
.btn:hover{background:var(--brand-d)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent)}
.btn.danger:hover{background:color-mix(in srgb,var(--bad) 10%,transparent)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.icon-btn:hover{background:var(--surface2)}

/* login */
.login{min-height:100dvh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(1100px 560px at 8% -10%,#3b82f6 0,transparent 60%),radial-gradient(900px 500px at 105% 110%,#f97316 0,transparent 55%),#0b1220}
.login-card{width:100%;max-width:420px;background:rgba(255,255,255,.97);color:#0f172a;border-radius:24px;padding:32px 28px;box-shadow:0 30px 80px rgba(0,0,0,.35);text-align:center}
.logo{width:64px;height:64px;border-radius:20px;margin:0 auto 18px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#2563eb,#7c3aed)}
.logo svg{width:32px;height:32px}
.login-card h1{font-size:22px;margin:0 0 6px;line-height:1.3}
.login-card p{margin:0 0 22px;color:#64748b}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 16px;min-height:50px;border-radius:14px;border:1px solid #dadce0;background:#fff;color:#1f2937;font-weight:600;cursor:pointer;transition:.15s}
.gbtn:hover{box-shadow:0 2px 10px rgba(0,0,0,.12)}
.gbtn svg{width:22px;height:22px}
.login-links{margin-top:16px;font-size:13px}
.login-links button{background:none;border:0;color:#2563eb;cursor:pointer;text-decoration:underline;padding:4px}
.banner{border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:16px;text-align:left}
.banner.err{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.banner.warn{background:#fffbeb;color:#92400e;border:1px solid #fde68a}

/* shell */
.shell{min-height:100dvh}
.sidebar{display:none}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));
  background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}
.brand .logo{width:36px;height:36px;border-radius:11px;margin:0}
.brand .logo svg{width:20px;height:20px}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px;line-height:1.2}
.sp{flex:1}
.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.menu{position:absolute;right:12px;top:60px;z-index:40;width:280px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:8px}
.menu .who{padding:10px 12px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.menu .who b{display:block}
.menu .who span{font-size:13px;color:var(--muted);word-break:break-all}
.menu button,.menu a{display:flex;gap:10px;align-items:center;width:100%;padding:10px 12px;border:0;background:none;border-radius:10px;cursor:pointer;text-align:left;text-decoration:none}
.menu button:hover,.menu a:hover{background:var(--surface2)}
main{padding:16px 16px 110px;max-width:1240px;margin:0 auto}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bottomnav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);text-decoration:none;padding:6px 2px;border-radius:12px;font-weight:500}
.bottomnav a.on{color:var(--brand);background:var(--brand-soft)}
@media (min-width:900px){
  .shell{display:grid;grid-template-columns:268px 1fr}
  .sidebar{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100dvh;padding:22px 14px;background:var(--surface);border-right:1px solid var(--line)}
  .sidebar .brand{padding:0 8px 18px}
  .sidebar a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;text-decoration:none;color:var(--muted);font-weight:500}
  .sidebar a:hover{background:var(--surface2);color:var(--text)}
  .sidebar a.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
  .sidebar .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:8px 10px}
  .bottomnav{display:none}
  main{padding:28px 32px 56px}
  .topbar .brand{display:none}
}

/* page */
.page-h{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin:6px 0 18px}
.page-h h1{font-size:24px;line-height:1.3;margin:0}
.page-h p{margin:2px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.kpi small{color:var(--muted);display:block}
.kpi b{font-size:24px;line-height:1.25;display:block;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;font-size:12.5px;color:var(--muted)}
.kpi.hl{background:linear-gradient(135deg,#2563eb,#6d4aff);color:#fff;border:0}
.kpi.hl small,.kpi.hl em{color:rgba(255,255,255,.8)}
.up{color:var(--ok)!important}.down{color:var(--bad)!important}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.panel h2{font-size:16px;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.two{display:grid;gap:16px}
@media (min-width:900px){.two{grid-template-columns:1fr 1fr}}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.toolbar .search{position:relative;flex:1 1 220px}
.toolbar .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.toolbar .search input{padding-left:38px}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;font-size:16px;outline:none;transition:.15s}
textarea{min-height:88px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)}
input[readonly]{background:var(--surface2);font-weight:600}
.toolbar select,.toolbar input[type=month]{width:auto;flex:0 1 170px}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:8px}
.card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--brand) 40%,var(--line))}
.card h3{margin:0;font-size:16.5px;line-height:1.4}
.card p{margin:0;font-size:14px}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px;padding-top:10px;border-top:1px dashed var(--line)}
.metrics.m2{grid-template-columns:repeat(2,1fr)}
.metrics b{display:block;font-size:15px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.metrics small{color:var(--muted);font-size:12px}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted)}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.c-blue{background:#e8f0ff;color:#1d4ed8;border-color:#c7d9ff}
.c-green{background:#e7f7ec;color:#15803d;border-color:#bfe8cc}
.c-red{background:#fdecec;color:#b91c1c;border-color:#f8c9c9}
.c-amber{background:#fff4dc;color:#a16207;border-color:#f6dc9c}
.c-gray{background:var(--surface2);color:var(--muted)}
@media (prefers-color-scheme:dark){
  .c-blue{background:#16244a;color:#9db9ff;border-color:#25396d}.c-green{background:#10301d;color:#86e0a5;border-color:#1c4d2f}
  .c-red{background:#3a1717;color:#ffa3a3;border-color:#5a2424}.c-amber{background:#3a2b0d;color:#f3cd7a;border-color:#59431a}
}
.empty{text-align:center;padding:48px 16px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius)}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}
.stars{color:#f59e0b;letter-spacing:1px}
.list-row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list-row:last-child{border:0}
.list-row .d{min-width:52px;text-align:center;background:var(--brand-soft);color:var(--brand);border-radius:12px;padding:4px 6px;font-weight:700;line-height:1.2}
.list-row .d small{display:block;font-weight:500;font-size:11px}
.list-row .t{flex:1;min-width:0}
.list-row .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-row .t span{font-size:13px;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.quick button{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;font-weight:600;text-align:left}
.quick button:hover{border-color:var(--brand);color:var(--brand)}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted);min-height:36px}
.seg button.on{background:var(--surface);color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* charts */
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cols{display:flex;align-items:flex-end;gap:8px;height:210px;min-width:520px;padding-top:18px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.col .bar{width:100%;max-width:38px;background:linear-gradient(180deg,var(--brand),#7c9cff);border-radius:8px 8px 3px 3px;transition:height .4s}
.col .cv{font-size:11px;color:var(--muted);margin-bottom:4px;white-space:nowrap}
.col .cl{font-size:12px;color:var(--muted);margin-top:6px}
.hb{display:grid;gap:10px}
.hb .r{display:grid;grid-template-columns:minmax(80px,38%) 1fr auto;gap:10px;align-items:center;font-size:14px}
.hb .r span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .tr{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.hb .tr i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--accent));border-radius:99px}
.hb .r b{font-variant-numeric:tabular-nums;font-size:13.5px}

/* dialog */
dialog{border:0;padding:0;border-radius:22px;width:calc(100% - 24px);max-width:720px;max-height:92dvh;background:var(--surface);color:var(--text);box-shadow:0 30px 90px rgba(0,0,0,.4);overflow:hidden}
dialog::backdrop{background:rgba(8,13,26,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet{display:flex;flex-direction:column;max-height:92dvh}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.sh-h h2{margin:0;font-size:18px}
.sh-b{padding:18px;overflow:auto;-webkit-overflow-scrolling:touch}
.sh-f{display:flex;gap:8px;align-items:center;padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface)}
.form-grid{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:640px){.form-grid{grid-template-columns:1fr 1fr}.form-grid .full{grid-column:1/-1}}
.fld label{display:block;font-size:13.5px;font-weight:600;margin-bottom:5px;color:var(--muted)}
.fld label i{color:var(--bad);font-style:normal}
@media (max-width:639px){
  dialog{margin:auto 0 0;width:100%;max-width:none;border-radius:22px 22px 0 0;max-height:94dvh}
  .sheet{max-height:94dvh}
}
details.help{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px}
details.help summary{cursor:pointer;font-weight:600}
details.help ol{margin:8px 0 2px;padding-left:20px}
details.help li{margin:4px 0}
code{background:var(--surface2);border:1px solid var(--line);padding:1px 6px;border-radius:6px;font-size:13px;word-break:break-all}

/* overlay / toast */
.loading{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.loading div{text-align:center}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--brand);animation:sp .8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:200;background:#0f172a;color:#fff;padding:11px 18px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:min(92vw,460px);font-size:14.5px}
.toast.err{background:#b91c1c}
@media (min-width:900px){.toast{bottom:28px}}
@media print{
  .sidebar,.topbar,.bottomnav,.actions,.toolbar,.seg,.quick{display:none!important}
  body{background:#fff;color:#000}.shell{display:block}main{padding:0}.panel,.kpi,.card{box-shadow:none}
}
</style>
</head>
<body>

<!-- ===== หน้าเข้าสู่ระบบ ===== -->
<section id="login" class="login hidden">
  <div class="login-card">
    <div class="logo" id="loginLogo"></div>
    <h1>ระบบกิจกรรมการตลาด</h1>
    <p>แผนกรถบรรทุกขนาดกลางและใหญ่<br>เข้าสู่ระบบด้วยบัญชี Google ของคุณ</p>
    <div id="loginMsg"></div>
    <button class="gbtn" id="btnLogin">
      <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      เข้าสู่ระบบด้วย Google
    </button>
    <div class="login-links"><button id="btnCfgLogin">ตั้งค่าการเชื่อมต่อ</button></div>
  </div>
</section>

<!-- ===== ตัวแอป ===== -->
<div id="app" class="shell hidden">
  <aside class="sidebar" id="sidebar"></aside>
  <div>
    <header class="topbar">
      <div class="brand"><div class="logo" id="topLogo"></div><div>กิจกรรมการตลาด<small>รถบรรทุกขนาดกลางและใหญ่</small></div></div>
      <div class="sp"></div>
      <button class="icon-btn" id="btnRefresh" title="รีเฟรชข้อมูล" aria-label="รีเฟรชข้อมูล"></button>
      <button class="avatar" id="btnUser" aria-label="บัญชีผู้ใช้"></button>
    </header>
    <div class="menu hidden" id="userMenu"></div>
    <main id="view"></main>
  </div>
  <nav class="bottomnav" id="bottomnav"></nav>
</div>

<div id="loading" class="loading hidden"><div><div class="spin"></div><span id="loadingTxt">กำลังโหลด…</span></div></div>
<dialog id="dlg"></dialog>
<div id="toast" class="toast hidden"></div>

<script>
'use strict';
/* =====================================================================
   ตั้งค่า (แก้ตรงนี้ หรือกรอกผ่านปุ่ม "ตั้งค่าการเชื่อมต่อ" ในหน้าเว็บก็ได้)
   - CLIENT_ID      : OAuth Client ID จาก Google Cloud Console
   - SPREADSHEET_ID : ID ของ Google Sheets (เว้นว่าง = ระบบสร้างชีตใหม่ให้อัตโนมัติหลังล็อกอินครั้งแรก)
   - ALLOWED_EMAILS : (ไม่บังคับ) จำกัดอีเมลที่เข้าใช้ได้ เช่น ['a@company.com'] ว่าง = ใครก็ได้ที่มีสิทธิ์ในชีต
   ===================================================================== */
const CONFIG = { CLIENT_ID:'228186209560-kbjge0imssga02eart2382a1o0hcbtlg.apps.googleusercontent.com', SPREADSHEET_ID:'', ALLOWED_EMAILS:[] };

const SCOPE = 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile';
const SHEETS = 'https://sheets.googleapis.com/v4/spreadsheets';
const LS_CFG = 'mkt_cfg_v1', SS_SESS = 'mkt_sess_v1';

/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = Number(v); return isFinite(n) ? n : 0; };

/* ---------- Google auth ---------- */
let tokResolve = null, tokReject = null;
function initGIS() {
  if (tokenClient) return true;
  if (!cfg.clientId || !window.google?.accounts?.oauth2) return false;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: cfg.clientId, scope: SCOPE,
    callback: r => r.error ? tokReject?.(new Error(r.error_description || r.error)) : tokResolve?.(r),
    error_callback: e => tokReject?.(new Error(e.type === 'popup_closed' ? 'ยกเลิกการเข้าสู่ระบบ' : e.type === 'popup_failed_to_open' ? 'เบราว์เซอร์บล็อกหน้าต่างล็อกอิน กรุณาอนุญาต Pop-up' : (e.message || e.type)))
  });
  return true;
}
function requestToken(prompt) {
  return new Promise((res, rej) => {
    if (!initGIS()) return rej(new Error('ยังโหลด Google Sign-In ไม่เสร็จ — กรุณารอสักครู่แล้วลองใหม่ หรือตรวจสอบอินเทอร์เน็ต'));
    tokResolve = res; tokReject = rej;
    tokenClient.requestAccessToken({ prompt, hint: user?.email });
  });
}
async function login() {
  if (!cfg.clientId) { openSettings(); return; }
  $('#btnLogin').disabled = true; loginMsg('');
  try {
    const r = await requestToken('select_account'); /* เรียกทันทีใน click handler เพื่อไม่ให้ popup ถูกบล็อก */
    if (!google.accounts.oauth2.hasGrantedAllScopes(r, 'https://www.googleapis.com/auth/spreadsheets')) throw new Error('ต้องอนุญาตสิทธิ์เข้าถึง Google Sheets เพื่อใช้งานระบบ');
    token = r.access_token; tokenExp = Date.now() + (r.expires_in - 60) * 1000;
    const u = await (await fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers: { Authorization: 'Bearer ' + token } })).json();
    user = { name: u.name || u.email, email: u.email, picture: u.picture };
    if (CONFIG.ALLOWED_EMAILS.length && !CONFIG.ALLOWED_EMAILS.map(e => e.toLowerCase()).includes(String(user.email).toLowerCase())) { const em = user.email; logout(true); throw new Error('บัญชี ' + em + ' ไม่ได้รับอนุญาตให้ใช้งานระบบนี้'); }
    sessionStorage.setItem(SS_SESS, JSON.stringify({ token, tokenExp, user }));
    await enterApp();
  } catch (e) { loginMsg(e.message, 'err'); }
  finally { $('#btnLogin').disabled = false; }
}
function loginMsg(msg, type = 'err') { $('#loginMsg').innerHTML = msg ? `<div class="banner ${type}">${esc(msg)}</div>` : ''; }
function logout(silent) {
  token = null; user = null; tokenClient = null; sessionStorage.removeItem(SS_SESS);
  DATA = { activities: [], visits: [], summaries: [], sales: [] };
  $('#userMenu').classList.add('hidden'); busy(false); show('login');
  if (!silent) loginMsg('');

async function silentRefresh() { const r = await requestToken('none'); token = r.access_token; tokenExp = Date.now() + (r.expires_in - 60) * 1000; sessionStorage.setItem(SS_SESS, JSON.stringify({ token, tokenExp, user })); }

/* ---------- Sheets API ---------- */
async function api(url, opt = {}, retry = true) {
  if (token && Date.now() > tokenExp && retry) { try { await silentRefresh(); } catch {} }
  const r = await fetch(url, { ...opt, headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json', ...(opt.headers || {}) } });
  if (r.status === 401 && retry) { try { await silentRefresh(); return api(url, opt, false); } catch { logout(true); loginMsg('เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่', 'warn'); throw new Error('เซสชันหมดอายุ'); } }
  if (!r.ok) {
    const e = await r.json().catch(() => ({})); const m = e.error?.message || ('HTTP ' + r.status);
    if (r.status === 403 || r.status === 404) throw new Error('เข้าถึง Google Sheets ไม่ได้ — โปรดตรวจสอบว่า Spreadsheet ID ถูกต้อง และเจ้าของชีตแชร์สิทธิ์ "ผู้แก้ไข" ให้บัญชี ' + (user?.email || '') + ' (' + m + ')');
    throw new Error(m);
  }
  return r.json();
}
async function createSpreadsheet() {
  const j = await api(SHEETS, { method: 'POST', body: JSON.stringify({ properties: { title: 'ระบบกิจกรรมการตลาด – รถบรรทุกขนาดกลางและใหญ่', locale: 'th_TH', timeZone: 'Asia/Bangkok' }, sheets: Object.values(SCHEMAS).map(S => ({ properties: { title: S.sheet, gridProperties: { frozenRowCount: 1 } } })) }) });
  saveCfg({ sheetId: j.spreadsheetId }); return j.spreadsheetId;
}
async function ensureStructure() {
  const id = cfg.sheetId;
  const meta = await api(`${SHEETS}/${id}?fields=sheets.properties(sheetId,title)`);
  SHEETIDS = Object.fromEntries(meta.sheets.map(s => [s.properties.title, s.properties.sheetId]));
  const add = Object.values(SCHEMAS).filter(S => !(S.sheet in SHEETIDS)).map(S => ({ addSheet: { properties: { title: S.sheet, gridProperties: { frozenRowCount: 1 } } } }));
  if (add.length) { const r = await api(`${SHEETS}/${id}:batchUpdate`, { method: 'POST', body: JSON.stringify({ requests: add }) }); r.replies.forEach(rp => { SHEETIDS[rp.addSheet.properties.title] = rp.addSheet.properties.sheetId; }); }
  const list = Object.values(SCHEMAS);
  const chk = await api(`${SHEETS}/${id}/values:batchGet?` + list.map(S => 'ranges=' + rng(S, 'A1:A1')).join('&'));
  const need = list.filter((S, i) => !(chk.valueRanges[i].values?.[0]?.[0]));
  if (need.length) {
    await api(`${SHEETS}/${id}/values:batchUpdate`, { method: 'POST', body: JSON.stringify({ valueInputOption: 'RAW', data: need.map(S => ({ range: `'${S.sheet}'!A1:${lastCol(S)}1`, values: [headers(S)] })) }) });
    await api(`${SHEETS}/${id}:batchUpdate`, { method: 'POST', body: JSON.stringify({ requests: need.map(S => ({ repeatCell: { range: { sheetId: SHEETIDS[S.sheet], startRowIndex: 0, endRowIndex: 1 }, cell: { userEnteredFormat: { textFormat: { bold: true, foregroundColor: { red: 1, green: 1, blue: 1 } }, backgroundColor: { red: .145, green: .388, blue: .921 } } }, fields: 'userEnteredFormat(textFormat,backgroundColor)' } })) }) });
  }
}
function toRec(S, row, i) {
  const r = { _row: i + 2 };
  META.forEach((k, j) => r[k] = row[j] ?? '');
  S.fields.forEach((f, j) => { let v = row[META.length + j] ?? ''; if (f.t === 'date' && typeof v === 'number') v = serialToISO(v); r[f.k] = v; });
  return r;
}
const toRow = (S, r) => [...META, ...S.fields.map(f => f.k)].map(k => r[k] ?? '');
async function loadAll() {
  const keys = Object.keys(SCHEMAS);
  const j = await api(`${SHEETS}/${cfg.sheetId}/values:batchGet?` + keys.map(k => 'ranges=' + rng(SCHEMAS[k], `A2:${lastCol(SCHEMAS[k])}`)).join('&') + '&valueRenderOption=UNFORMATTED_VALUE');
  keys.forEach((k, i) => { DATA[k] = (j.valueRanges[i].values || []).map((row, ix) => toRec(SCHEMAS[k], row, ix)).filter(r => r.id); });
}
async function findRow(key, id) {
  const j = await api(`${SHEETS}/${cfg.sheetId}/values/${rng(SCHEMAS[key], 'A2:A')}`);
  const i = (j.values || []).findIndex(r => r[0] === id);
  if (i < 0) throw new Error('ไม่พบรายการนี้ในชีต (อาจถูกลบไปแล้ว)');

}
async function saveRec(key, rec, isNew) {
  const S = SCHEMAS[key], now = new Date().toISOString();
  if (isNew) { rec.id = uid(); rec.created = now; rec.createdBy = user.email; }

  else { const n = await findRow(key, rec.id); await api(`${SHEETS}/${cfg.sheetId}/values/${rng(S, `A${n}:${lastCol(S)}${n}`)}?valueInputOption=RAW`, { method: 'PUT', body: JSON.stringify({ values: [row] }) }); }
}
async function deleteRec(key, id) {

  let inp;
  if (f.t === 'select') {
    let opts = (typeof f.o === 'function' ? f.o() : f.o).map(o => Array.isArray(o) ? o : [o, o]);
    if (val !== '' && val != null && !opts.some(o => String(o[0]) === String(val))) opts = [[val, val], ...opts];
    inp = `<select id="${id}" ${req}><option value="">— เลือก —</option>${opts.map(([v, l]) => `<option value="${esc(v)}" ${String(val) === String(v) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  } else if (f.t === 'textarea') inp = `<textarea id="${id}">${esc(val)}</textarea>`;
  else if (f.t === 'number') inp = `<input id="${id}" type="number" inputmode="decimal" step="any" min="0" value="${esc(val)}" ${req}>`;
  else if (f.t === 'computed') inp = `<input id="${id}" type="text" readonly value="${esc(val === '' ? '' : fmt(val))}" data-raw="${esc(val)}">`;
  else inp = `<input id="${id}" type="${f.t}" value="${esc(val)}" ${req}>`;
  return `<div class="fld ${f.full || f.t === 'textarea' ? 'full' : ''}"><label for="${id}">${esc(f.l)}${f.req ? ' <i>*</i>' : ''}</label>${inp}</div>`;
}
function openForm(key, id, preset) {
  const S = SCHEMAS[key], old = id ? DATA[key].find(r => r.id === id) : null, isNew = !old;
  const rec = old ? { ...old } : Object.fromEntries(S.fields.map(f => [f.k, f.d === 'today' ? todayISO() : f.d === 'user' ? (user.name || '') : (f.d ?? '')]));
  if (isNew && S.compute) S.compute(rec);
  const label = { activities: 'กิจกรรมการตลาด', visits: 'การเยี่ยมลูกค้า', summaries: 'สรุปผลกิจกรรม', sales: 'ยอดขาย' }[key];
  dlg.dataset.form = '1';
  dlg.innerHTML = `<form id="frm" class="sheet" novalidate>
    <header class="sh-h"><h2>${isNew ? 'เพิ่ม' : 'แก้ไข'}${label}</h2><button type="button" class="icon-btn" data-close aria-label="ปิด">${ic('x')}</button></header>
    <div class="sh-b"><div class="form-grid">${S.fields.map(f => fieldHTML(f, rec[f.k])).join('')}</div></div>
    <footer class="sh-f">${isNew ? '' : '<button type="button" class="btn danger" id="btnDel">ลบ</button>'}<span class="sp"></span><button type="button" class="btn ghost" data-close>ยกเลิก</button><button class="btn" id="btnSave">บันทึก</button></footer></form>`;
  dlg.showModal();
  const frm = $('#frm', dlg), el = k => $('#f_' + k, frm);
  const collect = () => { const o = { ...rec }; S.fields.forEach(f => { let v = el(f.k).value; if (f.t === 'number') v = v === '' ? '' : Number(v); else if (f.t === 'computed') v = ''; else v = v.trim(); o[f.k] = v; }); return o; };
  const recompute = () => { if (!S.compute) return; const o = collect(); S.compute(o); S.fields.filter(f => f.t === 'computed').forEach(f => { el(f.k).value = fmt(o[f.k]); el(f.k).dataset.raw = o[f.k]; }); };
  frm.addEventListener('input', e => { const k = e.target.id?.slice(2); if (!k) return; recompute(); S.hook?.(k, { get: x => el(x).value, set: (x, v) => { el(x).value = v; } }); });
  frm.addEventListener('submit', async e => {
    e.preventDefault(); if (!frm.reportValidity()) return;
    const out = collect(); if (S.compute) S.compute(out);
    const b = $('#btnSave', frm); b.disabled = true; b.textContent = 'กำลังบันทึก…';
    try { await saveRec(key, out, isNew); dlg.close(); toast('บันทึกเรียบร้อย ✓'); await loadAll(); render(); }
    catch (err) { toast(err.message, 'err'); b.disabled = false; b.textContent = 'บันทึก'; }
  });
  const del = $('#btnDel', frm);
  if (del) del.addEventListener('click', async () => {
    if (!confirm('ต้องการลบรายการนี้ใช่หรือไม่? การลบจะลบแถวใน Google Sheets ด้วย')) return;
    del.disabled = true; del.textContent = 'กำลังลบ…';
    try { await deleteRec(key, id); dlg.close(); toast('ลบรายการแล้ว'); await loadAll(); render(); }
    catch (err) { toast(err.message, 'err'); del.disabled = false; del.textContent = 'ลบ'; }
  });
}

/* ---------- ตั้งค่า ---------- */
function openSettings() {
  dlg.dataset.form = '';
  dlg.innerHTML = `<form id="cfgf" class="sheet">
    <header class="sh-h"><h2>ตั้งค่าการเชื่อมต่อ</h2><button type="button" class="icon-btn" data-close aria-label="ปิด">${ic('x')}</button></header>
    <div class="sh-b"><div class="form-grid">
      <div class="fld full"><label for="c_client">Google OAuth Client ID <i>*</i></label><input id="c_client" type="text" value="${esc(cfg.clientId)}" placeholder="xxxxxxxx.apps.googleusercontent.com" autocomplete="off" ${CONFIG.CLIENT_ID ? 'readonly' : ''}></div>
      <div class="fld full"><label for="c_sheet">Spreadsheet ID หรือลิงก์ Google Sheets</label><input id="c_sheet" type="text" value="${esc(cfg.sheetId)}" placeholder="เว้นว่าง = สร้างชีตใหม่ให้อัตโนมัติหลังล็อกอิน" autocomplete="off" ${CONFIG.SPREADSHEET_ID ? 'readonly' : ''}></div>
      <div class="full"><details class="help"><summary>วิธีขอ Client ID (ทำครั้งเดียว)</summary><ol>
        <li>เข้า <b>console.cloud.google.com</b> → สร้างโปรเจกต์ใหม่</li>
        <li>เมนู <b>APIs &amp; Services → Library</b> → เปิดใช้ <b>Google Sheets API</b></li>
        <li><b>OAuth consent screen</b> → เลือก External (หรือ Internal ถ้าใช้ Google Workspace) → เพิ่มอีเมลผู้ใช้ใน <b>Test users</b></li>
        <li><b>Credentials → Create credentials → OAuth client ID → Web application</b></li>
        <li>ที่ <b>Authorized JavaScript origins</b> ใส่ URL ที่เปิดเว็บนี้ เช่น <code>${esc(location.origin === 'null' ? 'https://ชื่อโฮสต์ของคุณ' : location.origin)}</code></li>
        <li>คัดลอก <b>Client ID</b> มาวางในช่องด้านบน</li></ol>
        <p class="muted" style="margin:6px 0 0">หมายเหตุ: Google ไม่รองรับการล็อกอินจากไฟล์ที่เปิดแบบ <code>file://</code> — ให้โฮสต์ไฟล์ (เช่น GitHub Pages, Netlify, Google Cloud Storage) หรือรัน <code>python -m http.server</code> แล้วเปิดที่ <code>http://localhost:8000</code></p></details></div>
      ${cfg.sheetId ? `<div class="full"><a class="btn ghost sm" target="_blank" rel="noopener" href="https://docs.google.com/spreadsheets/d/${esc(cfg.sheetId)}/edit">${ic('sheet')} เปิด Google Sheets</a><p class="muted" style="font-size:13px;margin:8px 0 0">ทีมงานคนอื่นต้องได้รับสิทธิ์ “ผู้แก้ไข” ในชีตนี้ และใช้ Spreadsheet ID เดียวกัน (ใส่ในค่า <code>CONFIG.SPREADSHEET_ID</code> ด้านบนของไฟล์ HTML เพื่อให้ทุกคนใช้ชีตเดียวกันอัตโนมัติ)</p></div>` : ''}
    </div></div>
    <footer class="sh-f"><span class="sp"></span><button type="button" class="btn ghost" data-close>ยกเลิก</button><button class="btn">บันทึกการตั้งค่า</button></footer></form>`;
  dlg.showModal();
  $('#cfgf', dlg).addEventListener('submit', e => {
    e.preventDefault();
    const raw = $('#c_sheet', dlg).value.trim(), m = raw.match(/\/d\/([a-zA-Z0-9-_]+)/);
    const changedSheet = (m ? m[1] : raw) !== cfg.sheetId;
    saveCfg({ clientId: $('#c_client', dlg).value.trim(), sheetId: m ? m[1] : raw });
    tokenClient = null; dlg.close(); toast('บันทึกการตั้งค่าแล้ว');
    if (user && changedSheet) location.reload();
    else if (!user) { loginMsg(''); initGIS(); }
  });
}

/* ---------- export CSV ---------- */
function exportCSV(key, rows) {
  const S = SCHEMAS[key], keys = [...META, ...S.fields.map(f => f.k)];
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const csv = '\ufeff' + [headers(S).map(q).join(','), ...rows.map(r => keys.map(k => q(r[k])).join(','))].join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `${S.sheet}_${todayISO()}.csv`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const t = e.target;
  if (!t.closest('#userMenu') && !t.closest('#btnUser')) $('#userMenu').classList.add('hidden');
  if (t.closest('[data-close]')) { dlg.close(); return; }
  if (t === dlg && dlg.dataset.form !== '1') { dlg.close(); return; }
  const edit = t.closest('[data-edit]'); if (edit) { const [k, id] = edit.dataset.edit.split(':'); openForm(k, id); return; }
  const tab = t.closest('[data-tab]'); if (tab) { state.salesTab = tab.dataset.tab; render(); return; }
  const rep = t.closest('button[data-rep]'); if (rep) { state.rep[rep.dataset.rep] = rep.dataset.v; render(); return; }
  const a = t.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'add') openForm(a.dataset.key);
  else if (act === 'export') exportCSV(a.dataset.key, filteredRows(a.dataset.key));
  else if (act === 'export-sales') exportCSV('sales', repRows(state.rep.y, state.rep.m));
  else if (act === 'print') window.print();
  else if (act === 'settings') { $('#userMenu').classList.add('hidden'); openSettings(); }
  else if (act === 'logout') logout();
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('.card[data-edit]')) { e.preventDefault(); e.target.click(); } });
document.addEventListener('input', e => { const k = e.target.dataset?.q; if (k) { state.q[k] = e.target.value; $('#listBody').innerHTML = listBody(k); } });
document.addEventListener('change', e => {
  const d = e.target.dataset || {};
  if (d.f) { state.f[d.f] = e.target.value; $('#listBody').innerHTML = listBody(d.f); }
  else if (d.m) { state.m[d.m] = e.target.value; $('#listBody').innerHTML = listBody(d.m); }
  else if (d.rep && e.target.tagName === 'SELECT') { state.rep[d.rep] = e.target.value; render(); }
});
$('#btnUser').addEventListener('click', () => $('#userMenu').classList.toggle('hidden'));

$('#btnRefresh').addEventListener('click', async () => { busy(true, 'กำลังโหลดข้อมูลล่าสุด…'); try { await loadAll(); render(); toast('อัปเดตข้อมูลแล้ว'); } catch (err) { toast(err.message, 'err'); } finally { busy(false); } });
$('#btnLogin').addEventListener('click', login);
$('#btnCfgLogin').addEventListener('click', openSettings);

/* ---------- boot ---------- */
window.initGIS = initGIS;
(function boot() {
  $('#loginLogo').innerHTML = ic('truck');
  initGIS();
  try {
    const s = JSON.parse(sessionStorage.getItem(SS_SESS) || 'null');
    if (s && s.token && s.tokenExp > Date.now() && cfg.clientId) { token = s.token; tokenExp = s.tokenExp; user = s.user; enterApp(); return; }
  } catch {}
  show('login');
  if (!cfg.clientId) loginMsg('ยังไม่ได้ตั้งค่า Google Client ID — กด “ตั้งค่าการเชื่อมต่อ” ด้านล่างเพื่อเริ่มต้น', 'warn');
})();
</script>
